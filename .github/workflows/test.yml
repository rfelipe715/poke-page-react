name: Test Suite

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # cambia a 'yarn' o 'pnpm' si usas otro

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        
      - name: Check production build
        run: npm run build
